<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Is It Apache or Pokémon?</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Press+Start+2P&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --blue: #7fd8f0;
                --red: #e5202a;
                --gold: #ffd12e;
                --navy: #1d3d8f;
                --ink: #1a1a1a;
                --stage: min(38vmin, 400px);
                --outline-thick: clamp(2px, 0.4vw, 5px);
                --outline-thin: clamp(1.5px, 0.25vw, 3px);
            }

            * {
                box-sizing: border-box;
            }

            html,
            body {
                margin: 0;
                height: 100%;
                overflow: hidden;
                font-family: "Press Start 2P", monospace;
                color: var(--ink);
            }

            .outlined {
                --outline: var(--outline-thick);
                text-shadow:
                    calc(var(--outline) * -1) calc(var(--outline) * -1) 0
                        var(--navy),
                    var(--outline) calc(var(--outline) * -1) 0 var(--navy),
                    calc(var(--outline) * -1) var(--outline) 0 var(--navy),
                    var(--outline) var(--outline) 0 var(--navy),
                    0 calc(var(--outline) * -1) 0 var(--navy),
                    0 var(--outline) 0 var(--navy),
                    calc(var(--outline) * -1) 0 0 var(--navy),
                    var(--outline) 0 0 var(--navy),
                    4px 4px 0 rgba(0, 0, 0, 0.3);
            }

            .stage {
                position: fixed;
                inset: 0;
                background: var(--blue);
            }

            .split {
                position: absolute;
                inset: 0;
                background: var(--red);
                clip-path: polygon(58% 0%, 100% 0%, 100% 100%, 38% 100%);
            }

            .split::before {
                content: "";
                position: absolute;
                inset: 0;
                background: #fff;
                clip-path: polygon(55% 0%, 61% 0%, 41% 100%, 35% 100%);
                opacity: 0.9;
            }

            .rays {
                position: absolute;
                top: 46%;
                left: 50%;
                width: 140vmax;
                height: 140vmax;
                transform: translate(-50%, -50%);
                background: repeating-conic-gradient(
                    rgba(255, 255, 255, 0.85) 0deg 4deg,
                    rgba(255, 255, 255, 0) 4deg 12deg
                );
                animation: spin 90s linear infinite;
                mix-blend-mode: screen;
            }

            @keyframes spin {
                to {
                    transform: translate(-50%, -50%) rotate(360deg);
                }
            }

            .glow {
                position: absolute;
                top: 46%;
                left: 50%;
                width: 55vmin;
                height: 55vmin;
                transform: translate(-50%, -50%);
                background: radial-gradient(
                    circle,
                    rgba(255, 255, 255, 0.95) 0%,
                    rgba(255, 255, 255, 0.4) 55%,
                    rgba(255, 255, 255, 0) 75%
                );
                border-radius: 50%;
            }

            .mark {
                position: absolute;
                top: 46%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: var(--stage);
                height: var(--stage);
                user-select: none;
                z-index: 6;
                transition: opacity 0.3s ease;
            }

            .mark svg {
                display: block;
                width: 100%;
                height: 100%;
                overflow: visible;
            }

            .mark text {
                font-family: "Luckiest Guy", cursive;
                font-size: 78px;
                text-anchor: middle;
                dominant-baseline: central;
                fill: var(--gold);
                stroke: var(--navy);
                stroke-width: 5px;
                stroke-linejoin: round;
                paint-order: stroke fill;
            }

            .silhouette-wrap {
                position: absolute;
                top: 46%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: var(--stage);
                height: var(--stage);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 3;
            }

            .platform {
                position: absolute;
                bottom: -2%;
                width: 80%;
                height: 12%;
                background: rgba(0, 20, 40, 0.25);
                border-radius: 50%;
                filter: blur(4px);
            }

            #logo {
                position: relative;
                width: 85%;
                height: 85%;
                object-fit: contain;
                filter: brightness(0) saturate(100%);
                transition: filter 0.6s ease;
            }

            #logo.revealed {
                filter: none;
                animation: pop 0.5s ease;
            }

            @keyframes pop {
                0% {
                    transform: scale(0.8) rotate(-3deg);
                }
                55% {
                    transform: scale(1.12) rotate(2deg);
                }
                100% {
                    transform: scale(1) rotate(0deg);
                }
            }

            .title-bar {
                position: absolute;
                top: 3%;
                left: 50%;
                transform: translateX(-50%);
                z-index: 4;
                background: rgba(10, 15, 30, 0.55);
                border-radius: 999px;
                padding: 10px 28px;
            }

            .title {
                margin: 0;
                font-family: "Luckiest Guy", cursive;
                font-size: min(6vw, 5vh);
                color: var(--gold);
                text-align: center;
                white-space: nowrap;
                letter-spacing: 1px;
            }

            .name-plate {
                position: absolute;
                top: calc(46% - (var(--stage) / 2) - 14px);
                left: 50%;
                transform: translate(-50%, -100%);
                white-space: nowrap;
                font-family: "Luckiest Guy", cursive;
                font-size: min(5vw, 4.6vh);
                color: #d8d8d8;
                opacity: 0.7;
                z-index: 8;
                transition:
                    opacity 0.2s ease,
                    color 0.2s ease;
            }

            .name-plate.spoiled {
                opacity: 1;
                color: var(--gold);
            }

            .name-plate.revealed {
                opacity: 1;
                color: var(--gold);
                animation: nameplate-pop 0.5s ease;
            }

            @keyframes nameplate-pop {
                0% {
                    transform: translate(-50%, -100%) scale(0.8) rotate(-3deg);
                }
                55% {
                    transform: translate(-50%, -100%) scale(1.12) rotate(2deg);
                }
                100% {
                    transform: translate(-50%, -100%) scale(1) rotate(0deg);
                }
            }

            .bottom-bar {
                position: fixed;
                left: 50%;
                bottom: 11%;
                transform: translateX(-50%);
                width: min(92vw, 640px);
                z-index: 5;
            }

            .choices {
                display: flex;
                gap: 10px;
            }

            .choice-btn {
                flex: 1;
                font-family: "Luckiest Guy", cursive;
                font-size: 20px;
                letter-spacing: 1px;
                padding: 14px 10px;
            }

            #apache-btn {
                background: var(--blue);
            }
            #pokemon-btn {
                background: var(--red);
                color: #fff;
            }

            button {
                font-family: inherit;
                font-size: 9px;
                border: 3px solid var(--navy);
                border-radius: 4px;
                cursor: pointer;
                color: var(--ink);
                box-shadow: 0 3px 0 var(--navy);
                transition:
                    transform 0.1s ease,
                    box-shadow 0.1s ease,
                    opacity 0.2s ease;
            }

            button:active:not(:disabled) {
                transform: translateY(3px);
                box-shadow: 0 0 0 var(--navy);
            }
            button:disabled {
                cursor: not-allowed;
            }

            .reveal {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 10px;
                text-align: center;
            }

            .reveal[hidden],
            .choices[hidden] {
                display: none;
            }

            #dialogue {
                margin: 0;
                font-family: "Luckiest Guy", cursive;
                font-size: min(6vw, 4.8vh);
                letter-spacing: 1px;
                color: var(--gold);
            }

            #dialogue.correct {
                color: #7ee787;
            }
            #dialogue.wrong {
                color: #ff8a8a;
            }

            #project-desc {
                margin: 0;
                color: #fff;
                font-size: 9px;
                line-height: 1.7;
                text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
            }

            #next-btn {
                background: #7ed957;
                padding: 10px 20px;
                font-size: 11px;
            }

            .stats {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 12px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 0 4%;
                color: var(--gold);
                font-size: 8px;
                z-index: 5;
                text-shadow: 0 2px 3px rgba(0, 0, 0, 0.5);
            }

            .name-toggle {
                display: flex;
                align-items: center;
                gap: 5px;
                cursor: pointer;
                user-select: none;
            }

            .name-toggle input {
                margin: 0;
                cursor: pointer;
            }

            @media (max-width: 640px) {
                :root {
                    --stage: min(52vmin, 280px);
                }
                .name-plate {
                    font-size: min(6vw, 3.4vh);
                }
                .title-bar {
                    top: 2%;
                    padding: 8px 18px;
                }
                .title {
                    font-size: min(7vw, 4.2vh);
                }
                .choices {
                    flex-direction: column;
                }
                .bottom-bar {
                    bottom: 13%;
                }
                #dialogue {
                    font-size: min(8vw, 4.4vh);
                }
            }
        </style>
    </head>
    <body>
        <div class="stage">
            <div class="split"></div>
            <div class="rays"></div>
            <div class="glow"></div>

            <div class="title-bar">
                <h1 class="title outlined">Is It Apache or Pokémon?</h1>
            </div>

            <div class="name-plate outlined" id="name-plate"></div>

            <div class="mark" id="mark">
                <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
                    <text id="mark-text" x="50" y="50">?</text>
                </svg>
            </div>

            <div class="silhouette-wrap">
                <div class="platform"></div>
                <img
                    id="logo"
                    src=""
                    alt="Mystery silhouette"
                    draggable="false"
                />
            </div>

            <div class="bottom-bar">
                <div class="choices" id="choices">
                    <button
                        id="apache-btn"
                        class="choice-btn"
                        type="button"
                        disabled
                    >
                        Apache
                    </button>
                    <button
                        id="pokemon-btn"
                        class="choice-btn"
                        type="button"
                        disabled
                    >
                        Pokémon
                    </button>
                </div>

                <div class="reveal" id="reveal" hidden>
                    <p id="dialogue" class="outlined"></p>
                    <p id="project-desc" hidden></p>
                    <button id="next-btn" type="button">Next →</button>
                </div>
            </div>

            <div class="stats">
                <span id="score">Score: 0</span>
                <label class="name-toggle">
                    <input type="checkbox" id="show-name-toggle" />
                    Show name
                </label>
                <span id="streak">Streak: 0</span>
            </div>
        </div>

        <script>
            // Live data sources — nothing is baked into this page:
            // - Apache project names/marks come from simple-icons' published catalogue.
            // - Pokémon names/artwork come from PokéAPI and its companion sprite repo.
            // - Apache project descriptions come from the ASF's own project registry.
            const ICON_DATA_URL =
                "https://cdn.jsdelivr.net/npm/simple-icons@latest/data/simple-icons.json";
            const POKEMON_LIST_URL =
                "https://pokeapi.co/api/v2/pokemon?limit=2000&offset=0";
            const PROJECTS_API_URL =
                "https://projects.apache.org/json/foundation/projects.json";
            const apacheImageUrl = (slug) =>
                `https://cdn.simpleicons.org/${slug}`;
            const pokemonImageUrl = (id) =>
                `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${id}.png`;

            // simple-icons slugs whose artwork bakes the word "Apache" into
            // the mark itself (a wordmark, not just an icon), which would
            // give the category away regardless of the "?" silhouette.
            // Checked by rendering every candidate icon and eyeballing it —
            // there's no way to detect this from the data automatically.
            const APACHE_WORDMARK_SLUGS = new Set([
                "apachejmeter",
                "apachekylin",
                "apachelucene",
            ]);

            const logoEl = document.getElementById("logo");
            const markEl = document.getElementById("mark");
            const markTextEl = document.getElementById("mark-text");
            const namePlateEl = document.getElementById("name-plate");
            const choicesEl = document.getElementById("choices");
            const revealEl = document.getElementById("reveal");
            const dialogueEl = document.getElementById("dialogue");
            const projectDescEl = document.getElementById("project-desc");
            const apacheBtn = document.getElementById("apache-btn");
            const pokemonBtn = document.getElementById("pokemon-btn");
            const nextBtn = document.getElementById("next-btn");
            const scoreEl = document.getElementById("score");
            const streakEl = document.getElementById("streak");
            const showNameToggle = document.getElementById("show-name-toggle");

            const state = {
                apacheRoster: [],
                pokemonRoster: [],
                recent: [],
                current: null,
                score: 0,
                streak: 0,
                solved: false,
                showName: showNameToggle.checked,
            };

            // Before a guess: show the real name only if the "Show name"
            // option is on. After a guess: always show it, win or lose.
            function updateNamePlate() {
                if (!state.current) return;
                const nameVisible = state.showName || state.solved;
                namePlateEl.textContent = nameVisible
                    ? state.current.name
                    : "???";
                // Same dim styling as "???" pre-guess even when the name
                // option shows the real name — only the post-guess reveal
                // gets the gold "spoiled" treatment.
                namePlateEl.classList.toggle("spoiled", state.solved);
            }

            function titleCase(slug) {
                return slug
                    .split("-")
                    .map((part) => part.charAt(0).toUpperCase() + part.slice(1))
                    .join(" ");
            }

            function normalizeKey(str) {
                return str.toLowerCase().replace(/[^a-z0-9]/g, "");
            }

            function shortText(str, maxLen = 130) {
                if (!str) return "";
                const clean = str.replace(/\s+/g, " ").trim();
                if (clean.length <= maxLen) return clean;
                const cut = clean.slice(0, maxLen);
                return cut.slice(0, cut.lastIndexOf(" ")) + "…";
            }

            function pickNext() {
                // Flip the category first so a 36-project pool and a 1300+ Pokémon
                // pool still come up equally often, then pick within that category.
                const category = Math.random() < 0.5 ? "apache" : "pokemon";
                const pool =
                    category === "apache"
                        ? state.apacheRoster
                        : state.pokemonRoster;
                const fresh = pool.filter((p) => !state.recent.includes(p.id));
                const choices = fresh.length ? fresh : pool;
                const item =
                    choices[Math.floor(Math.random() * choices.length)];

                state.recent.push(item.id);
                if (state.recent.length > 20) state.recent.shift();

                return { ...item, category };
            }

            function startRound() {
                state.current = pickNext();
                state.solved = false;

                logoEl.src = state.current.image;
                logoEl.classList.remove("revealed");
                markEl.style.opacity = "1";
                namePlateEl.classList.remove("revealed");
                updateNamePlate();

                projectDescEl.hidden = true;
                projectDescEl.textContent = "";
                dialogueEl.textContent = "";
                dialogueEl.classList.remove("correct", "wrong");

                choicesEl.hidden = false;
                revealEl.hidden = true;
                apacheBtn.disabled = false;
                pokemonBtn.disabled = false;
            }

            function handleChoice(category) {
                if (state.solved || !state.current) return;
                state.solved = true;

                const correct = category === state.current.category;

                apacheBtn.disabled = true;
                pokemonBtn.disabled = true;

                logoEl.classList.add("revealed");
                markEl.style.opacity = "0";
                updateNamePlate();
                namePlateEl.classList.add("revealed");

                if (
                    state.current.category === "apache" &&
                    state.current.description
                ) {
                    projectDescEl.textContent = state.current.description;
                    projectDescEl.hidden = false;
                }

                const article =
                    state.current.category === "apache"
                        ? "an Apache project"
                        : "a Pokémon";
                dialogueEl.textContent = `That's ${article}!`;
                dialogueEl.classList.toggle("correct", correct);
                dialogueEl.classList.toggle("wrong", !correct);

                if (correct) {
                    state.score += 1;
                    state.streak += 1;
                } else {
                    state.streak = 0;
                }

                updateScoreboard();
                choicesEl.hidden = true;
                revealEl.hidden = false;
                nextBtn.focus();
            }

            function updateScoreboard() {
                scoreEl.textContent = `Score: ${state.score}`;
                streakEl.textContent = `Streak: ${state.streak}`;
            }

            async function init() {
                try {
                    const [iconRes, pokemonRes, projectsRes] =
                        await Promise.all([
                            fetch(ICON_DATA_URL),
                            fetch(POKEMON_LIST_URL),
                            // Descriptions are a nice-to-have — don't let a
                            // failure here block the whole game.
                            fetch(PROJECTS_API_URL).catch(() => null),
                        ]);
                    if (!iconRes.ok)
                        throw new Error(`Failed to load ${ICON_DATA_URL}`);
                    if (!pokemonRes.ok)
                        throw new Error(`Failed to load ${POKEMON_LIST_URL}`);

                    const icons = await iconRes.json();
                    const pokemonList = await pokemonRes.json();

                    const descriptionsByName = new Map();
                    if (projectsRes && projectsRes.ok) {
                        try {
                            const projects = await projectsRes.json();
                            for (const entry of Object.values(projects)) {
                                if (!entry || !entry.name) continue;
                                const desc =
                                    entry.shortdesc || entry.description;
                                if (desc)
                                    descriptionsByName.set(
                                        normalizeKey(entry.name),
                                        desc,
                                    );
                            }
                        } catch (err) {
                            console.error(
                                "Could not parse Apache project descriptions",
                                err,
                            );
                        }
                    }

                    state.apacheRoster = icons
                        .filter(
                            (icon) =>
                                icon.title.startsWith("Apache ") &&
                                icon.title !== "Apache",
                        )
                        .map((icon) => {
                            const slug =
                                icon.slug ||
                                icon.title
                                    .toLowerCase()
                                    .replace(/[^a-z0-9]/g, "");
                            const cleanTitle = icon.title.replace(
                                /\sIDE$/,
                                "",
                            );
                            return {
                                id: `apache-${slug}`,
                                slug,
                                name: cleanTitle.replace(/^Apache\s+/, ""),
                                image: apacheImageUrl(slug),
                                description: shortText(
                                    descriptionsByName.get(
                                        normalizeKey(cleanTitle),
                                    ),
                                ),
                            };
                        })
                        .filter(
                            (item) => !APACHE_WORDMARK_SLUGS.has(item.slug),
                        );

                    state.pokemonRoster = pokemonList.results
                        .map((p) => {
                            const id = p.url
                                .replace(/\/$/, "")
                                .split("/")
                                .pop();
                            return {
                                id: `pokemon-${id}`,
                                name: titleCase(p.name),
                                image: pokemonImageUrl(id),
                            };
                        })
                        // PokéAPI's list is full of regional/mega/gmax forms
                        // and a few multi-word legendaries (e.g. "raichu-alola"
                        // -> "Raichu Alola", "tapu-koko" -> "Tapu Koko"); a
                        // single hyphenated slug reads oddly once titleCased,
                        // so keep only the one-word canonical names.
                        .filter((item) => !item.name.includes(" "));

                    if (
                        !state.apacheRoster.length ||
                        !state.pokemonRoster.length
                    ) {
                        throw new Error(
                            "One of the data sources returned no usable entries",
                        );
                    }
                } catch (err) {
                    dialogueEl.textContent =
                        "Couldn't load game data. Try refreshing.";
                    dialogueEl.classList.add("wrong");
                    choicesEl.hidden = true;
                    revealEl.hidden = false;
                    nextBtn.hidden = true;
                    console.error(err);
                    return;
                }

                apacheBtn.addEventListener("click", () =>
                    handleChoice("apache"),
                );
                pokemonBtn.addEventListener("click", () =>
                    handleChoice("pokemon"),
                );
                nextBtn.addEventListener("click", startRound);
                showNameToggle.addEventListener("change", () => {
                    state.showName = showNameToggle.checked;
                    updateNamePlate();
                });

                updateScoreboard();
                startRound();
            }

            // Font metrics (baseline/x-height) vary enough between fonts and
            // renderers that CSS alone can't reliably center a single glyph
            // in its box, so measure the rendered ink with getBBox() and
            // nudge it to true-center instead. This has to run *after* the
            // webfont has actually swapped in and been painted — measuring
            // too early silently centers the fallback font's glyph shape
            // instead, which is the wrong shape and produces exactly this
            // kind of "looks close but isn't centered" result.
            function centerMarkGlyph() {
                if (!markTextEl) return;
                const box = markTextEl.getBBox();
                if (!box.width || !box.height) return;
                const dx = 50 - (box.x + box.width / 2);
                // A "?" is visually top-heavy — the hook's stroke mass sits
                // in the upper two-thirds, with only the thin dot below —
                // so bounding-box centering reads as too high to the eye.
                // Nudge the box (not just its ink) down to compensate.
                const opticalBias = 11;
                const dy = 50 - (box.y + box.height / 2) + opticalBias;
                markTextEl.setAttribute("transform", `translate(${dx}, ${dy})`);
            }

            const fontsReady =
                document.fonts && document.fonts.ready
                    ? document.fonts.ready
                    : Promise.resolve();
            const fontLoaded =
                document.fonts && document.fonts.load
                    ? document.fonts
                          .load('400 78px "Luckiest Guy"')
                          .catch(() => {})
                    : Promise.resolve();

            centerMarkGlyph();
            Promise.all([fontsReady, fontLoaded]).then(() => {
                centerMarkGlyph();
                // One more pass a couple of frames later catches engines
                // that resolve font-loading promises a beat before the
                // swapped-in glyph is actually painted (and thus queryable
                // via getBBox).
                requestAnimationFrame(() =>
                    requestAnimationFrame(centerMarkGlyph),
                );
            });

            init();
        </script>
    </body>
</html>
